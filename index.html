<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#450B17" />
    <title>Clothy Home — Heirloom Indian Sarees &amp; Dress Fabrics</title>
    <meta
      name="description"
      content="Clothy Home is a modern Indian fashion house — handwoven sarees, churidar sets and dress fabrics, made slowly and worn for a lifetime."
    />
    <meta property="og:title" content="Clothy Home — Heirloom Indian Fashion" />
    <meta property="og:description" content="Handwoven sarees, kurta sets and dress fabrics from a modern Indian atelier." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Inter+Tight:ital,wght@0,300..700;1,300..600&display=swap"
      rel="stylesheet"
    />
    <!-- The mark cropped from the supplied wordmark; the light cut is served
         to dark-mode browser chrome. -->
    <link rel="icon" href="/favicon.png" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-light.png" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <style>
      /* Critical: painted before the bundle arrives so there is no white flash. */
      html { background: #14110d; }
      #boot-veil {
        position: fixed; inset: 0; z-index: 999;
        display: grid; place-items: center;
        background: #14110d;
        transition: opacity .5s ease, visibility .5s;
      }
      #boot-veil.is-gone { opacity: 0; visibility: hidden; }
      .boot-mark {
        width: min(240px, 46vw); height: auto;
        opacity: 0; animation: bootIn 1.1s .15s ease forwards;
      }
      @keyframes bootIn { to { opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot veil: painted before React mounts so the first frame is never a white flash. -->
    <div id="boot-veil" aria-hidden="true">
      <img class="boot-mark" src="/logo/Clothyhome logo Off-white 02.png" alt="" width="1669" height="517" />
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
